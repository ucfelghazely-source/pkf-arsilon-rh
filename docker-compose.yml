version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pkf_arsilon_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pkf_arsilon_rh
      POSTGRES_USER: pkf_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/01_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkf_user -d pkf_arsilon_rh"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pkf_arsilon_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pkf_arsilon_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pkf_user:${DB_PASSWORD}@postgres:5432/pkf_arsilon_rh
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pkf_arsilon_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.pkf-arsilon-casa.internal
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://rh.pkf-arsilon.ma
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
