<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKF Arsilon Casablanca — Plateforme RH</title>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A3A5C;--blue:#2563A8;--cyan:#06B6D4;--cyan-lt:#CFFAFE;
  --surface:#F8FAFC;--card:#FFFFFF;--border:rgba(26,58,92,0.11);
  --text:#0F1C2E;--text2:#4A6280;--text3:#8BA3BE;
  --green:#059669;--green-bg:#ECFDF5;--green-br:#6EE7B7;
  --amber:#D97706;--amber-bg:#FFFBEB;--amber-br:#FCD34D;
  --red:#DC2626;--red-bg:#FEF2F2;--red-br:#FCA5A5;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --blue-bg:#EFF6FF;--blue-br:#93C5FD;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--surface);color:var(--text);font-size:14px;line-height:1.5}
input,select,textarea,button{font-family:inherit;font-size:13px}

/* ── TOPBAR ── */
.topbar{background:var(--navy);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:600;color:white;letter-spacing:-.3px}
.logo span{color:var(--cyan)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 12px 4px 4px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.user-chip .username{font-size:12px;color:white}
.user-chip .role-badge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500}
.notif-btn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;color:white;font-size:16px}
.notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#F87171;border:1.5px solid var(--navy)}

/* ── LAYOUT ── */
.shell{display:flex;height:calc(100vh - 52px)}
.sidebar{width:210px;background:var(--card);border-right:0.5px solid var(--border);overflow-y:auto;flex-shrink:0;padding:12px 0}
.main{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.sid-section{margin-bottom:4px}
.sid-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:8px 16px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-left:2.5px solid transparent;transition:all .1s}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue);font-weight:500}
.nav-icon{font-size:16px;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red-bg);color:var(--red);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.nav-badge.green{background:var(--green-bg);color:var(--green)}

/* ── PAGES ── */
.page{display:none;flex-direction:column;gap:16px}
.page.active{display:flex}

/* ── CARDS ── */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px 20px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}
.card-action{font-size:12px;color:var(--blue);cursor:pointer;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── KPI CARDS ── */
.kpi{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.kpi-val{font-size:26px;font-weight:600;line-height:1}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:3px}
.kpi-bar{height:4px;border-radius:2px;background:var(--border);margin-top:8px;overflow:hidden}
.kpi-fill{height:100%;border-radius:2px}

/* ── GREETING ── */
.greeting{background:var(--navy);border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;color:white}
.greeting-left{display:flex;align-items:center;gap:16px}
.date-box{background:rgba(255,255,255,.15);border-radius:8px;padding:10px 14px;text-align:center;min-width:62px}
.date-num{font-size:24px;font-weight:700;line-height:1}
.date-lbl{font-size:11px;color:rgba(255,255,255,.65);margin-top:1px}
.greeting-info h2{font-size:18px;font-weight:600}
.greeting-info p{font-size:13px;color:rgba(255,255,255,.65);margin-top:2px}
.greeting-right{background:rgba(255,255,255,.12);border-radius:8px;padding:12px 16px;text-align:center;min-width:140px}
.greeting-right .big{font-size:22px;font-weight:600;margin-top:2px}
.greeting-right .lbl{font-size:11px;color:rgba(255,255,255,.65)}

/* ── STATUS BADGES ── */
.badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.badge-pending{background:var(--amber-bg);color:var(--amber);border:0.5px solid var(--amber-br)}
.badge-approved{background:var(--green-bg);color:var(--green);border:0.5px solid var(--green-br)}
.badge-refused{background:var(--red-bg);color:var(--red);border:0.5px solid var(--red-br)}
.badge-tt{background:#DBEAFE;color:#1E40AF}
.badge-cp{background:#D1FAE5;color:#065F46}
.badge-adm{background:var(--purple-bg);color:var(--purple)}
.badge-css{background:#FEF3C7;color:#92400E}
.badge-mal{background:#FEE2E2;color:#991B1B}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;border-bottom:0.5px solid var(--border);background:var(--surface)}
td{padding:9px 10px;border-bottom:0.5px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface)}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:600;color:var(--text2)}
.fg input,.fg select,.fg textarea{border:0.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);background:var(--card);outline:none;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,168,.12)}
.fg textarea{resize:vertical;min-height:70px}

/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:0.5px solid;transition:all .1s}
.btn-primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn-primary:hover{background:#1d4e8e}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-br)}
.btn-danger:hover{background:#fde8e8}
.btn-outline{background:transparent;color:var(--blue);border-color:var(--blue-br)}
.btn-outline:hover{background:var(--blue-bg)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-green{background:var(--green-bg);color:var(--green);border-color:var(--green-br)}
.btn-green:hover{background:#d1fae5}

/* ── ALERTS ── */
.alert{border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:12px}
.alert-warn{background:var(--amber-bg);border:0.5px solid var(--amber-br);color:#78350F}
.alert-info{background:var(--blue-bg);border:0.5px solid var(--blue-br);color:#1E40AF}
.alert-success{background:var(--green-bg);border:0.5px solid var(--green-br);color:#065F46}
.alert-error{background:var(--red-bg);border:0.5px solid var(--red-br);color:#991B1B}
.alert-icon{font-size:15px;flex-shrink:0;margin-top:1px}

/* ── WORKFLOW ── */
.wf{display:flex;align-items:center;margin:12px 0}
.wf-step{display:flex;flex-direction:column;align-items:center;gap:3px}
.wf-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.wf-done{background:var(--green);color:white}
.wf-active{background:var(--blue);color:white}
.wf-wait{background:var(--surface);color:var(--text3);border:1.5px solid var(--border)}
.wf-line{flex:1;height:2px;background:var(--border)}
.wf-line.done{background:var(--green)}
.wf-lbl{font-size:9px;color:var(--text3);text-align:center;max-width:50px}

/* ── QUOTA BAR ── */
.qbar{display:flex;align-items:center;gap:8px;padding:6px 0}
.qbar-name{font-size:12px;color:var(--text2);min-width:120px}
.qbar-track{flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.qbar-fill{height:100%;border-radius:3px;transition:width .3s}
.qbar-count{font-size:11px;color:var(--text2);min-width:36px;text-align:right}

/* ── CALENDAR ── */
.cal-wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{font-size:10px;font-weight:600;color:var(--text3);text-align:center;padding:3px 0}
.cal-cell{text-align:center;padding:5px 2px;border-radius:6px;cursor:pointer;font-size:11px;min-height:28px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;border:1px solid transparent}
.cal-cell:hover{background:var(--surface)}
.cal-cell.today{background:var(--blue);color:white;font-weight:600}
.cal-cell.weekend{color:var(--text3)}
.cal-cell.holiday{background:#FEF3C7;color:#92400E}
.cal-cell.tt{background:#DBEAFE;color:#1E40AF}
.cal-cell.cp{background:#D1FAE5;color:#065F46}
.cal-cell.selected{border-color:var(--blue);background:var(--blue-bg)}
.cal-cell.disabled{opacity:.35;cursor:not-allowed}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,28,46,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text3);padding:2px 6px;border-radius:6px}
.modal-close:hover{background:var(--surface);color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:0.5px solid var(--border)}

/* ── TOASTS ── */
.toast-area{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.12);animation:slideIn .3s ease;min-width:260px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--blue)}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:40px;width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .big{font-size:26px;font-weight:700;color:var(--navy)}
.login-logo .big span{color:var(--blue)}
.login-logo .sub{font-size:13px;color:var(--text2);margin-top:4px}
.login-sso{background:var(--blue-bg);border:1.5px solid var(--blue-br);border-radius:10px;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;margin-bottom:16px}
.login-sso:hover{background:#dbeafe;border-color:var(--blue)}
.login-sso-icon{width:36px;height:36px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:white;font-size:18px;flex-shrink:0}
.login-sso-text p{font-size:13px;font-weight:600;color:var(--blue)}
.login-sso-text span{font-size:11px;color:var(--text2)}
.login-sep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text3);font-size:12px}
.login-sep::before,.login-sep::after{content:'';flex:1;height:0.5px;background:var(--border)}
.login-users{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.login-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0.5px solid var(--border);cursor:pointer;transition:all .1s}
.login-user:hover{background:var(--blue-bg);border-color:var(--blue-br)}
.login-user .av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.login-user .info p{font-size:12px;font-weight:500}
.login-user .info span{font-size:10px;color:var(--text3)}
.login-user .role{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500}

/* ── PAGE HEADER ── */
.ph{display:flex;align-items:flex-start;justify-content:space-between}
.ph-title{font-size:16px;font-weight:600}
.ph-sub{font-size:12px;color:var(--text3);margin-top:2px}

/* ── MISC ── */
.sep{height:0.5px;background:var(--border);margin:10px 0}
.region-pill{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--blue-bg);color:var(--blue);font-weight:500}
.req-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.req-row:last-child{border-bottom:none}
.req-info{flex:1}
.req-info p{font-size:13px;color:var(--text)}
.req-info small{font-size:11px;color:var(--text3)}
.solde-alert{color:var(--red);font-weight:600}
.hidden{display:none!important}
</style>
</head>

<!-- ─── LOGIN ─────────────────────────────────────── -->
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="big">PKF <span>Arsilon</span></div>
      <div class="sub">Plateforme RH · Bureau de Casablanca</div>
    </div>

    <div class="login-sso" onclick="loginSSO()">
      <div class="login-sso-icon">🔐</div>
      <div class="login-sso-text">
        <p>Connexion SSO PKF</p>
        <span>Utilisez vos identifiants réseau arsilon.com</span>
      </div>
    </div>

    <div class="login-sep">ou choisir un compte de démonstration</div>

    <div class="login-users" id="userList"></div>
  </div>
</div>

<!-- ─── APP ───────────────────────────────────────── -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="logo">PKF <span>Arsilon</span> <span style="font-size:11px;opacity:.5;font-weight:400;margin-left:6px">Casablanca · RH</span></div>
    </div>
    <div class="topbar-right">
      <button class="notif-btn" onclick="showNotifs()" title="Notifications">
        🔔<div class="notif-dot" id="notifDot"></div>
      </button>
      <div class="user-chip" onclick="logout()">
        <div class="avatar" id="topAvatar"></div>
        <span class="username" id="topName"></span>
        <span class="role-badge" id="topRole"></span>
      </div>
    </div>
  </div>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="mainContent"></main>
  </div>
</div>

<!-- ─── MODAL ─────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-hd">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ─── TOASTS ─────────────────────────────────────── -->
<div class="toast-area" id="toastArea"></div>

function initials(u){return (u.firstName[0]+u.lastName[0]).toUpperCase()}
function fullName(u){return u.firstName+' '+u.lastName}
function userById(id){return USERS.find(u=>u.id===id)}
function fmt(d){if(!d)return'—';const dt=new Date(d);return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}
function fmtShort(d){if(!d)return'—';const dt=new Date(d);return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}

function avatarHtml(u,size=32,radius=8){
  const s=`width:${size}px;height:${size}px;border-radius:${radius}px;background:#${u.color}20;color:#${u.color};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.38)}px;font-weight:600;flex-shrink:0`;
  return `<div style="${s}">${initials(u)}</div>`;
}

function badgeStatus(s){
  const m={PENDING:'badge-pending',APPROVED:'badge-approved',REFUSED:'badge-refused'};
  const l={PENDING:'En attente',APPROVED:'Validé',REFUSED:'Refusé'};
  return `<span class="badge ${m[s]||''}">${l[s]||s}</span>`;
}

function badgeType(t){
  const m={TT:'badge-tt',CP:'badge-cp',ADM:'badge-adm',CSS:'badge-css',MAL:'badge-mal'};
  const l={TT:'TT',CP:'CP',ADM:'ADM'};
  return `<span class="badge ${m[t]||''}">${l[t]||t}</span>`;
}

function soldeColor(s){return s<0?'var(--red)':s<3?'var(--amber)':'var(--green)'}

function toast(msg,type='info'){
  const icons={success:'✅',error:'❌',info:'ℹ️',warn:'⚠️'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toastArea').appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

  document.getElementById('modalTitle').textContent=title;

function submitTT(){
  const date=document.getElementById('ttDate').value;
  if(!date){toast('Sélectionnez une date','error');return;}
  const dt=new Date(date);
  const week=getISOWeek(dt);
  const weekUsed=REQUESTS.filter(r=>r.userId===currentUser.id&&r.type==='TT'&&r.week===week&&['APPROVED','PENDING'].includes(r.status)).length;
  if(weekUsed>=2){toast('❌ Quota 2j/semaine déjà atteint pour cette semaine','error');return;}
  REQUESTS.push({id:'rq'+Date.now(),userId:currentUser.id,type:'TT',date,week,status:'PENDING',approvedBy:null,createdAt:new Date().toISOString().split('T')[0]});
  NOTIFS.push({id:'n'+Date.now(),userId:'usr_mgr',text:`${fullName(currentUser)} — Demande TT ${fmtShort(date)} en attente`,type:'TT',read:false});
  closeModal();
  toast('✅ Demande TT soumise — en attente de validation manager','success');
  renderTT();
}

function getISOWeek(d){
  const date=new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}

              </div>
              ${r.type==='CP'&&solde!==null?`<div style="font-size:11px;color:var(--text3);margin-top:2px">Solde CP disponible : <strong style="color:${soldeColor(solde)}">${solde}j</strong></div>`:''}
              <div style="font-size:11px;color:var(--text3)">Soumis le ${fmt(r.createdAt)}</div>
              ${alertMsg?`<div class="alert alert-warn" style="margin-top:8px;padding:6px 10px"><span>⚠️</span>${alertMsg}</div>`:''}
              <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-green btn-sm" onclick="approveReq('${r.id}')">✅ Approuver</button>
                <button class="btn btn-danger btn-sm" onclick="refuseReq('${r.id}')">❌ Refuser</button>
                <button class="btn btn-ghost btn-sm" onclick="commentReq('${r.id}')">💬 Commenter</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function approveReq(id){
  const r=REQUESTS.find(x=>x.id===id);
  if(!r)return;
  // Vérif quota TT
  if(r.type==='TT'){
    const wUsed=REQUESTS.filter(x=>x.userId===r.userId&&x.type==='TT'&&x.week===r.week&&x.status==='APPROVED'&&x.id!==id).length;
    if(wUsed>=2){
      toast('❌ Impossible : quota 2j/semaine déjà atteint pour ce collaborateur','error');return;
    }
  }
  r.status='APPROVED';r.approvedBy=currentUser.id;
  NOTIFS.push({id:'n'+Date.now(),userId:r.userId,text:`Votre demande ${r.type} a été approuvée par ${fullName(currentUser)}`,type:r.type,read:false});
  toast(`✅ Demande de ${fullName(userById(r.userId))} approuvée`,'success');
  buildSidebar();renderValidations();
}

function refuseReq(id){
  openModal('Motif de refus',
    `<div class="fg"><label>Raison du refus</label><textarea id="refuseReason" placeholder="Ex: Conflit planning équipe, quota dépassé..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-danger" onclick="doRefuse('${id}')">❌ Confirmer le refus</button>`);
}

function doRefuse(id){
  const reason=document.getElementById('refuseReason').value||'Refusé par le manager';
  const r=REQUESTS.find(x=>x.id===id);
  if(!r)return;
  r.status='REFUSED';r.refusedReason=reason;
  NOTIFS.push({id:'n'+Date.now(),userId:r.userId,text:`Votre demande ${r.type} a été refusée : ${reason}`,type:r.type,read:false});
  closeModal();
  toast(`Demande de ${fullName(userById(r.userId))} refusée`,'info');
  buildSidebar();renderValidations();
}

function commentReq(id){
  openModal('Ajouter un commentaire',
    `<div class="fg"><label>Commentaire</label><textarea id="commentText" placeholder="Visible par le collaborateur..."></textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="closeModal();toast('💬 Commentaire envoyé','success')">Envoyer</button>`);
}

function cancelRequest(id){
  const r=REQUESTS.find(x=>x.id===id);
  if(r&&r.status==='PENDING'){r.status='REFUSED';r.refusedReason='Annulé par le collaborateur';toast('Demande annulée','info');renderTT();}
}

function editBalance(uid){

    `<div class="form-grid">

      <div class="fg"><label>CP acquis FY26</label><input type="number" id="eb_acq" value="${b.acquired}" step="0.5"></div>
      <div class="fg"><label>CP consommés</label><input type="number" id="eb_cons" value="${b.consumed}" step="0.5"></div>
      <div class="fg"><label>JF Maroc travaillés</label><input type="number" id="eb_jf" value="${b.jfWork}" step="1"></div>

    <div class="fg" style="margin-top:12px"><label>Motif de modification</label><input type="text" id="eb_note" placeholder="Ex: Correction import FY26"></div>`,

     <button class="btn btn-primary" onclick="saveBalance('${uid}')">💾 Enregistrer</button>`);

function saveBalance(uid){
  CP_BALANCES[uid]={

    jfWork:+document.getElementById('eb_jf').value,
  };
  closeModal();toast('✅ Solde mis à jour','success');renderAdmin();
}

  const myNotifs=NOTIFS.filter(n=>n.userId===currentUser.id);
  myNotifs.forEach(n=>n.read=true);
  updateNotifDot();
  const body=myNotifs.length?myNotifs.map(n=>`

      <span style="font-size:18px">${n.type==='TT'?'💻':n.type==='CP'?'🏖️':'📋'}</span>
