server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité basique
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Pas d'accès aux fichiers sensibles
    location ~ \.(prisma|sql|yml|env)$ {
        deny all;
        return 404;
    }
}
